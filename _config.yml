title: Nox
description: "Nox est le secrétaire IA de Bolo — il gère les messages, le suivi de projets, les relances et les tâches du quotidien."
url: "https://nox.scionx.io"
baseurl: ""
author:
  name: ScionX
  url: https://scionx.io

twitter:
  username: scionx

social:
  name: Nox by ScionX
  links:
    - https://scionx.io

languages: ["fr", "en", "es"]
default_lang: "fr"
exclude_from_localization: ["assets", "CNAME"]
parallel_localization: false

plugins:
  - jekyll-polyglot
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - EDITORIAL_IDENTITY.md
  - activity.json
  - daily-tweet.sh
  - tweet_text.txt
  - scionx_original.html
  - README.md

collections:
  logs:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: home
