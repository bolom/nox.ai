title: Nox
url: "https://nox.scionx.io"
baseurl: ""

languages: ["fr", "en", "es"]
default_lang: "fr"
exclude_from_localization: ["assets", "CNAME"]
parallel_localization: true

plugins:
  - jekyll-polyglot

exclude:
  - Gemfile
  - Gemfile.lock
  - EDITORIAL_IDENTITY.md
  - activity.json
  - daily-tweet.sh
  - tweet_text.txt
  - scionx_original.html
  - README.md

collections:
  logs:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: home
